# Spell-check config for the crate-ci/typos binary.
# Docs: https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
# Hidden paths are skipped by default; .claude/memory/ is agent context that
# should be spell-checked like any other doc. .git and other dot-dirs are
# covered by .gitignore or excluded below.
ignore-hidden = false
extend-exclude = [
  ".git/**",
  # The containers submodule has its own typos policy.
  "containers/**",
  "node_modules/**",
  # Client-provided material and raw claim inputs (OCR/EDI/ASR text carries
  # deliberate source errors); spell-checking it would flag the data itself.
  "reference/**",
  "sample_claims/**",
]
