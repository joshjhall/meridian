# Lefthook configuration
# Install hooks: lefthook install
# Run manually:  lefthook run pre-commit [--all-files]
#
# Tooling is provided by the containers devcontainer (dev-tools feature).
# Every tool skips gracefully when run on a host that lacks it.

# ============================================================================
# Pre-commit stage: runs on `git commit`
# ============================================================================
pre-commit:
  parallel: true
  commands:
    check-merge-conflict:
      run: |
        if /usr/bin/grep -lE '^(<{7} |>{7} |={7}$)' {staged_files} 2>/dev/null; then
          echo "ERROR: merge conflict markers found in the above file(s)"
          exit 1
        fi

    # --- Markdown linting (rumdl) — lint-only; run `rumdl fmt` to rewrite ---
    # Excludes (client material, append-only memory) live in .rumdl.toml.

    rumdl:
      glob: "*.md"
      skip:
        - run: "! command -v rumdl >/dev/null 2>&1"
      run: rumdl check {staged_files}

    # --- Agent memory bundle: OKF conformance (librarian) ---
    # The validator exits 0 with findings on stdout, so fail on any output.
    # Checks the whole bundle, not just staged files, so orphan and index
    # checks see every concept.

    okf-conformance:
      glob:
        - ".claude/memory/*.md"
        - ".claude/memory/**/*.md"
      skip:
        - run: "! test -x /opt/librarian/plugins/review-audit/skills/check-okf-conformance/patterns.sh"
      run: |
        list=$(mktemp)
        find .claude/memory -name '*.md' -not -path '*/tmp/*' > "$list"
        out=$(bash /opt/librarian/plugins/review-audit/skills/check-okf-conformance/patterns.sh "$list" </dev/null)
        rm -f "$list"
        if [ -n "$out" ]; then
          printf '%s\n' "$out"
          echo "ERROR: OKF findings in .claude/memory (see above)"
          exit 1
        fi

    # --- Python (ruff) — pinned in demo/backend/uv.lock; config in demo/ruff.toml ---
    # root: demo/ so {staged_files} cover backend/ and data/ alike.

    ruff:
      root: "demo/"
      glob: "*.py"
      run: >-
        uv run --frozen --project backend ruff check --fix {staged_files}
        && uv run --frozen --project backend ruff format {staged_files}
      stage_fixed: true

    # --- Jinja / HTMX templates (djlint) ---
    # Vendored Basecoat components are excluded in pyproject [tool.djlint].

    djlint:
      root: "demo/backend/"
      # glob/exclude match repo-root paths; {staged_files} are relative to root.
      glob:
        - "demo/backend/templates/*.html"
        - "demo/backend/templates/**/*.html"
      exclude:
        - "demo/backend/templates/components/**"
      # Reformat first (its non-zero exit only means "changed"), then lint gates.
      run: uv run --frozen djlint --reformat {staged_files} ; uv run --frozen djlint --lint {staged_files}
      stage_fixed: true

    # --- CSS / JS (biome) ---

    biome:
      glob: "*.{css,js}"
      skip:
        - run: "! command -v biome >/dev/null 2>&1"
      run: biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    # --- YAML / JSON formatting (dprint) ---

    dprint:
      glob: "*.{yml,yaml,json}"
      exclude:
        - ".vscode/**"
        - ".devcontainer/**"
        - "containers/**"
      skip:
        - run: "! command -v dprint >/dev/null 2>&1"
      run: dprint fmt {staged_files}
      stage_fixed: true

    # --- TOML formatting (taplo) ---

    taplo:
      glob: "*.toml"
      exclude:
        - "containers/**"
      skip:
        - run: "! command -v taplo >/dev/null 2>&1"
      run: taplo fmt {staged_files}
      stage_fixed: true

    # --- Shell (devcontainer lifecycle scripts, future tooling) ---

    shellcheck:
      glob: "*.sh"
      exclude:
        - "containers/**"
      skip:
        - run: "! command -v shellcheck >/dev/null 2>&1"
      run: shellcheck --severity=warning {staged_files}

    shfmt:
      glob: "*.sh"
      exclude:
        - "containers/**"
      skip:
        - run: "! command -v shfmt >/dev/null 2>&1"
      run: shfmt -w -i 4 -ci {staged_files}
      stage_fixed: true

    # --- Security ---

    gitleaks:
      skip:
        - run: "! command -v gitleaks >/dev/null 2>&1"
      run: gitleaks protect --staged --verbose --redact

# ============================================================================
# commit-msg stage
# ============================================================================
commit-msg:
  commands:
    conform:
      skip:
        - run: "! command -v conform >/dev/null 2>&1"
      run: conform enforce --commit-msg-file {1}

# ============================================================================
# Pre-push stage
# ============================================================================
pre-push:
  parallel: true
  commands:
    typos:
      skip:
        - run: "! command -v typos >/dev/null 2>&1"
      run: typos

    rumdl-check:
      glob: "*.md"
      skip:
        - run: "! command -v rumdl >/dev/null 2>&1"
      run: rumdl check .

    dprint-check:
      glob: "*.{yml,yaml,json}"
      skip:
        - run: "! command -v dprint >/dev/null 2>&1"
      run: dprint check

    # Whole-project type check; too slow and cross-file for pre-commit.
    pyright:
      glob: "demo/**/*.py"
      skip:
        - run: "! command -v just >/dev/null 2>&1"
      run: just lint-types

    # Unstaged-safe full sweep of the demo's Python, templates, and web assets.
    demo-lint:
      glob: "demo/**/*.{py,html,jinja,css,js}"
      skip:
        - run: "! command -v just >/dev/null 2>&1"
      run: just lint-py lint-templates lint-web
