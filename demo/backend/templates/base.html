<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Meridian demo{% endblock %}</title>
    {# Order matters: Basecoat (Tailwind theme, preflight, components) first,
       then our Tailwind utilities build (just css). #}
    <link rel="stylesheet" href="/static/vendor/basecoat/basecoat.cdn.min.css" />
    <link rel="stylesheet" href="{{ asset('app.css') }}" />
    <script src="/static/vendor/basecoat/all.min.js" defer></script>
    <script src="/static/vendor/htmx/htmx.min.js" defer></script>
    <script>
      // Basecoat initializes components inserted by HTMX swaps on its own; a
      // history restore brings back already-initialized DOM, so force a reset.
      document.addEventListener("htmx:historyRestore", () => window.basecoat?.initAll({ force: true }));
    </script>
    {% block head %}{% endblock %}
  </head>
  <body{% block body_attrs %}{% endblock %}>
    {% block appbar %}{% endblock %}
    <main class="{% block main_class %}mx-auto max-w-5xl p-6{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
