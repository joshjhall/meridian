# CI for the Meridian demo: tests, built-CSS freshness, and the lefthook lint
# checks, so they apply on every PR even where hooks aren't installed.
# Recipes come from the root justfile; tool versions match the devcontainer.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: demo/backend/uv.lock
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0
      # Python comes from demo/backend/.python-version (3.14); uv installs it.
      - run: just test

  css:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: demo/backend/uv.lock
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0
      - run: just css
      - name: Check committed app.css is current
        run: |
          if ! git diff --exit-code -- demo/backend/static/app.css; then
            echo "::error file=demo/backend/static/app.css::app.css is stale. Run 'just css' and commit the result."
            exit 1
          fi

  # Every file check in lefthook.yml (pre-commit and pre-push) runs here, except:
  # - okf-conformance: needs the librarian plugin at /opt/librarian, which only
  #   exists in the devcontainer.
  # - conform (commit-msg): checks commit messages, not files.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: demo/backend/uv.lock
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0,biome@2.5.14,dprint@0.57.4,taplo@0.10.0,typos@1.50.3,shfmt@3.14.1,shellcheck@0.10.0
      - name: Install rumdl and gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # From the release's gitleaks_8.30.1_checksums.txt; update with the version.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          uv tool install rumdl==0.2.77
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Merge conflict markers
        run: |
          if git grep -nE '^(<{7} |>{7} |={7}$)' -- . ':!containers'; then
            echo "::error::merge conflict markers found in the files above"
            exit 1
          fi
      # ruff, pyright, djlint, biome, rumdl, dprint, taplo, shellcheck, shfmt, typos
      - run: just lint
      # Lefthook scans staged changes; CI scans the full history (small repo).
      - run: gitleaks git --redact --no-banner .
